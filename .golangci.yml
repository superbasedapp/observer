# golangci-lint v2 configuration (schema "2"). Migrated from the v1 file on
# 2026-10-09 with `golangci-lint migrate` (v2.12.2, built with go1.26.2) when
# the repo moved to Go 1.26 (lane GO126, T-696): v1.64.8 cannot lint a module
# whose go directive is newer than the Go it was built with, and v1 is end of
# life. The rule set is unchanged; only the schema moved:
#   - gofumpt / goimports are now `formatters`, not linters;
#   - `issues.exclude-dirs` / `exclude-rules` are now `linters.exclusions`;
#   - v1's default exclusions (exclude-use-default) are kept via `presets`,
#     and v1's default skipped dirs (third_party, builtin, examples) via paths;
#   - `run.timeout` is gone (v2 has no timeout by default; the v1 file used
#     20m because the tree outgrew 5m on CI runners).
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    staticcheck:
      # v2 folds gosimple (S*) and stylecheck (ST*, QF*) into staticcheck.
      # The v1 config enabled only staticcheck (SA*), never gosimple or
      # stylecheck, so keep the same scope: widening it is a separate
      # decision, not part of a toolchain move.
      checks:
        - "SA*"
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
        - name: package-comments
          severity: warning
          disabled: false
    gosec:
      excludes:
        # G115 (integer overflow on numeric conversions) is categorically noisy on
        # this codebase's protobuf / varint / length parsing and is not a memory-
        # safety risk in Go: a bad conversion yields a wrong value, and any
        # downstream slice index is bounds-checked (recovered panic, never memory
        # corruption). Proving bounds to gosec would mean restructuring every
        # parser for zero security gain. All OTHER gosec rules stay enabled; the
        # SQL (G201/G202) and subprocess (G204) findings are justified per-line.
        - G115
    gocyclo:
      # Spec §2.7 targets a threshold of 15. The existing (pre-Teams) codebase has
      # ~250 functions over 15 across ~30 packages, so 15 cannot be enforced now
      # without grandfathering nearly the whole repo (which would make gocyclo
      # gate nothing). Enforced at 30 today, which genuinely gates new complexity
      # tree-wide (only 20 pre-existing functions exceed it, all excluded below),
      # and ratcheted toward 15 during the post-Teams complexity refactor
      # (tracked in PROGRESS.md / docs/handover-teams-M5-*).
      min-complexity: 30
  exclusions:
    generated: lax
    # v1's default exclusion patterns (exclude-use-default: true).
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive
      # Test fixtures legitimately use conventional 0644 file permissions (G306),
      # embed dummy/sample credentials (G101) and use math/rand (G404); none
      # carry production secrets or run in production. gosec on test code is noise.
      - path: _test\.go
        linters:
          - gosec
      # Cyclomatic complexity on test functions is noise: table-driven tests
      # legitimately enumerate many cases through one func. gocyclo is a
      # production-code signal, so exclude it from tests.
      - path: _test\.go
        linters:
          - gocyclo
      # The 20 pre-existing functions that exceed the enforced gocyclo threshold
      # of 30 (the Codex parser ParseSessionFile reaches 249, ParseStructured
      # Trajectory 161, newBackfillCmd 139, the proxy serve loop 76, ...). These
      # are shipped parsers, the proxy hot path, store.Ingest, dashboard handlers
      # and the backfill suite; refactoring them inside the M5 release-hardening
      # PR would risk the byte-identical / never-break-the-host-tool invariant for
      # zero Teams benefit. Scoped out here and tracked for an incremental refactor
      # AFTER the Teams feature lands (PROGRESS.md / docs/handover-teams-M5-*),
      # which also ratchets min-complexity down toward the spec's 15. Files added
      # outside this list stay gated at 30.
      # The adapter-owned splits of backfill.go / hook.go (lane MP-L1D, T-598:
      # the same functions, moved behind their adapter's omit tag) keep the
      # exemption they had in place.
      - path: cmd/observer/(backfill|hook|init|start)(_antigravity|_codex|_cursor|_hermes)?\.go
        linters:
          - gocyclo
      - path: internal/adapter/antigravity/(adapter|structured)\.go
        linters:
          - gocyclo
      - path: internal/adapter/(claudecode|codex|cursor)/adapter\.go
        linters:
          - gocyclo
      - path: internal/adapter/copilotcli/events\.go
        linters:
          - gocyclo
      - path: internal/intelligence/dashboard/(analysis|dashboard|export)\.go
        linters:
          - gocyclo
      - path: internal/proxy/proxy\.go
        linters:
          - gocyclo
      - path: internal/store/store\.go
        linters:
          - gocyclo
    # Same list for linters and formatters (see formatters.exclusions.paths).
    paths: &excluded-paths
      - testdata
      - bin
      - scripts
      # /scratchpad/ is gitignored (see .gitignore): throwaway operator
      # probes and one-off estate-verification programs that never reach a
      # commit, a release artifact or CI. Linting them made `make lint`
      # diverge from the CI gate (which checks out a tree without them) AND
      # blew the run timeout, so a genuine tree-wide finding could be
      # truncated away behind hundreds of scratch-file gofumpt messages.
      - scratchpad
      # Vendored npm packages can ship Go source (e.g. flatted's golang/ port
      # under vscode/node_modules); third-party code isn't ours to lint and CI
      # never installs node_modules for the Go job.
      - node_modules
      # oapi-codegen output (DO NOT EDIT). Declaring security schemes used only
      # by documentation-tagged operations emits unused context-key types that
      # `unused` would flag; generated code is regenerated deterministically and
      # is not hand-maintained, so it is excluded from lint.
      - internal/orgserver/api/gen
      - internal/orgserver/dashboard/gen
      - internal/orgclient/gen
      # The in-module copy of a third-party package, kept byte-identical to
      # its release except the patch its UPSTREAM file records (lane SEC-G5:
      # internal/thirdparty/actionlint), so it is not linted as our code.
      - internal/thirdparty
      # v1's default skipped directories (skip-dirs-use-default).
      - third_party$
      - builtin$
      - examples$

issues:
  # Report every finding (golangci-lint defaults hide the 4th+ identical
  # message and cap each linter at 50) so CI and `make lint` show the full
  # picture rather than a truncated sample.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/marmutapp/superbased-observer
  exclusions:
    generated: lax
    paths: *excluded-paths
