rules:
  - id: go.cors-credentials-any-origin
    languages: [go]
    severity: WARNING
    message: CORS allows credentials for any origin, so any website a signed-in user visits can read this API's responses; list the allowed origins.
    metadata:
      category: code_vuln
      cwe: CWE-942
    pattern-either:
      - pattern: 'cors.Options{..., AllowedOrigins: []string{"*"}, ..., AllowCredentials: true, ...}'
      - pattern: 'cors.Options{..., AllowCredentials: true, ..., AllowedOrigins: []string{"*"}, ...}'
      - pattern: 'cors.Config{..., AllowAllOrigins: true, ..., AllowCredentials: true, ...}'
      - pattern: 'cors.Config{..., AllowCredentials: true, ..., AllowAllOrigins: true, ...}'
      - pattern: 'cors.Config{..., AllowOrigins: []string{"*"}, ..., AllowCredentials: true, ...}'
      - pattern: 'cors.Config{..., AllowCredentials: true, ..., AllowOrigins: []string{"*"}, ...}'
      - patterns:
          - pattern-inside: |
              func $FN(...) {
                ...
                $W.Header().Set("Access-Control-Allow-Credentials", "true")
                ...
              }
          - pattern: $W.Header().Set("Access-Control-Allow-Origin", $R.Header.Get("Origin"))
