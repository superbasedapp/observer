rules:
  - id: java.weak-password-hash
    languages: [java]
    severity: ERROR
    message: A password is hashed with a fast general-purpose hash (MD5, SHA-1 or a single SHA-2 round); use bcrypt, scrypt, argon2 or PBKDF2 with a high iteration count.
    metadata:
      category: code_vuln
      cwe: CWE-916
    patterns:
      - pattern-either:
          - pattern: $MD.digest($PW.getBytes(...))
          - pattern: $MD.update($PW.getBytes(...))
          - pattern: DigestUtils.$H($PW)
          - pattern: Hashing.$HF().hashString($PW, ...)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(.*\.)?(password|passwd|pwd|pass|passphrase|userPassword|newPassword|plainPassword|getPassword\(\))$
