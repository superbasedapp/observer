rules:
  - id: csharp.cors-credentials-any-origin
    languages: [csharp]
    severity: WARNING
    message: CORS allows credentials for any origin (every origin accepted by SetIsOriginAllowed, or the request's own Origin reflected), so any website a signed-in user visits can read this API's responses; list the allowed origins.
    metadata:
      category: code_vuln
      cwe: CWE-942
    pattern-either:
      - pattern: $P.SetIsOriginAllowed($O => true).AllowCredentials()
      - pattern: $P.SetIsOriginAllowed($O => true).$A(...).AllowCredentials()
      - pattern: $P.SetIsOriginAllowed($O => true).$A(...).$B(...).AllowCredentials()
      - pattern: $P.AllowCredentials().SetIsOriginAllowed($O => true)
      - pattern: $P.SetIsOriginAllowed(_ => true).AllowCredentials()
      - pattern: $P.SetIsOriginAllowed(_ => true).$A(...).AllowCredentials()
      - pattern: $P.SetIsOriginAllowed(_ => true).$A(...).$B(...).AllowCredentials()
      - patterns:
          - pattern-inside: |
              $RT $FN(...) {
                ...
                $H["Access-Control-Allow-Credentials"] = "true";
                ...
              }
          - pattern: $H["Access-Control-Allow-Origin"] = $REQ.Headers["Origin"]
