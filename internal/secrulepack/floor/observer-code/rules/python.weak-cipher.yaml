rules:
  - id: python.weak-cipher
    languages: [python]
    severity: WARNING
    message: A broken or weak cipher (DES, 3DES, RC4, Blowfish) or ECB mode is used; use AES-GCM or ChaCha20-Poly1305.
    metadata:
      category: code_vuln
      cwe: CWE-327
    pattern-either:
      - pattern: DES.new(...)
      - pattern: DES3.new(...)
      - pattern: ARC4.new(...)
      - pattern: ARC2.new(...)
      - pattern: Blowfish.new(...)
      - pattern: $C.new($K, $C.MODE_ECB, ...)
      - pattern: algorithms.ARC4(...)
      - pattern: algorithms.TripleDES(...)
      - pattern: algorithms.Blowfish(...)
      - pattern: modes.ECB(...)
