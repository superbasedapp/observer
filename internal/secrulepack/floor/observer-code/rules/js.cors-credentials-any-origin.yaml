rules:
  - id: js.cors-credentials-any-origin
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows credentials for any origin, so any site can make authenticated requests as the user.
    metadata:
      category: code_vuln
      cwe: CWE-942
    pattern-either:
      - pattern: 'cors({..., origin: true, ..., credentials: true, ...})'
      - pattern: 'cors({..., credentials: true, ..., origin: true, ...})'
      - pattern: 'cors({..., origin: "*", ..., credentials: true, ...})'
      - pattern: 'cors({..., credentials: true, ..., origin: "*", ...})'
      - pattern: 'cors({..., origin: (...) => $CB(null, true), ..., credentials: true, ...})'
