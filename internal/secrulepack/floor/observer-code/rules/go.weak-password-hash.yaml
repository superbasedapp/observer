rules:
  - id: go.weak-password-hash
    languages: [go]
    severity: ERROR
    message: A password is hashed with a fast general-purpose hash (MD5, SHA-1 or a single SHA-2 round); use bcrypt, scrypt or argon2.
    metadata:
      category: code_vuln
      cwe: CWE-916
    patterns:
      - pattern-either:
          - pattern: $HASH.$SUM([]byte($PW))
          - pattern: $HASH.$SUM([]byte($PW + $SALT))
          - pattern: $HASH.$SUM([]byte($SALT + $PW))
          - pattern: $HASH.$SUM(append([]byte($PW), ...))
      - metavariable-regex:
          metavariable: $HASH
          regex: ^(md5|sha1|sha256|sha512)$
      - metavariable-regex:
          metavariable: $SUM
          regex: ^(Sum|Sum256|Sum224|Sum512|Sum384)$
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(.*\.)?(password|passwd|pwd|pass|passphrase|userPassword|newPassword|plainPassword)$
