rules:
  - id: python.cors-credentials-any-origin
    languages: [python]
    severity: WARNING
    message: CORS allows credentials for any origin, so any website a signed-in user visits can read this API's responses; list the allowed origins.
    metadata:
      category: code_vuln
      cwe: CWE-942
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: CORS(..., supports_credentials=True, ...)
              - pattern: cross_origin(..., supports_credentials=True, ...)
          - pattern-not: CORS(..., origins=$O, ...)
          - pattern-not: cross_origin(..., origins=$O, ...)
          - pattern-not: CORS(..., resources=$R, ...)
      - pattern: CORS(..., origins="*", ..., supports_credentials=True, ...)
      - pattern: CORS(..., supports_credentials=True, ..., origins="*", ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origin_regex=".*", ..., allow_credentials=True, ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origin_regex=".*", ...)
      - patterns:
          - pattern-inside: |
              CORS_ALLOW_CREDENTIALS = True
              ...
          - pattern: CORS_ALLOW_ALL_ORIGINS = True
