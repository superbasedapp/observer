rules:
  - id: python.weak-password-hash
    languages: [python]
    severity: ERROR
    message: A password is hashed with a fast hash; use a password hash such as argon2, bcrypt, scrypt or PBKDF2.
    metadata:
      category: code_vuln
      cwe: CWE-916
    patterns:
      - pattern-either:
          - pattern: hashlib.$H($PW, ...)
          - pattern: hashlib.$H($PW.encode(...), ...)
          - pattern: hashlib.new("$N", $PW, ...)
          - pattern: hashlib.new("$N", $PW.encode(...), ...)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(.*\.)?(password|passwd|pwd|pass|passphrase|user_password|new_password|plain_password)$
