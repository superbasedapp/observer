rules:
  - id: java.cors-credentials-any-origin
    languages: [java]
    severity: WARNING
    message: CORS allows credentials for any origin (an origin pattern of * or the request's own Origin reflected), so any website a signed-in user visits can read this API's responses; list the allowed origins.
    metadata:
      category: code_vuln
      cwe: CWE-942
    pattern-either:
      - pattern: $X.allowedOriginPatterns("*").allowCredentials(true)
      - pattern: $X.allowedOriginPatterns("*").$A(...).allowCredentials(true)
      - pattern: $X.allowedOriginPatterns("*").$A(...).$B(...).allowCredentials(true)
      - pattern: $X.allowCredentials(true).allowedOriginPatterns("*")
      - patterns:
          - pattern-inside: |
              $RT $FN(...) {
                ...
                $C.setAllowCredentials(true);
                ...
              }
          - pattern-either:
              - pattern: $C.addAllowedOriginPattern("*")
              - pattern: $C.setAllowedOriginPatterns(List.of("*"))
              - pattern: $C.setAllowedOriginPatterns(Arrays.asList("*"))
              - pattern: $C.setAllowedOriginPatterns(Collections.singletonList("*"))
      - patterns:
          - pattern-inside: |
              $RT $FN(...) {
                ...
                $RESP.$SET("Access-Control-Allow-Credentials", "true");
                ...
              }
          - pattern: $RESP.$SET("Access-Control-Allow-Origin", $REQ.getHeader("Origin"))
