rules:
  - id: csharp.weak-password-hash
    languages: [csharp]
    severity: ERROR
    message: A password is hashed with a fast general-purpose hash (MD5, SHA-1 or a single SHA-2 round); use PasswordHasher, Rfc2898DeriveBytes.Pbkdf2 with a high iteration count, bcrypt or argon2.
    metadata:
      category: code_vuln
      cwe: CWE-916
    patterns:
      - pattern-either:
          - pattern: $H.ComputeHash(Encoding.$E.GetBytes($PW))
          - pattern: $ALG.HashData(Encoding.$E.GetBytes($PW))
          - pattern: $H.ComputeHash(Encoding.$E.GetBytes($PW + $SALT))
          - pattern: $ALG.HashData(Encoding.$E.GetBytes($PW + $SALT))
          - pattern: $H.ComputeHash(Encoding.$E.GetBytes($SALT + $PW))
          - pattern: $ALG.HashData(Encoding.$E.GetBytes($SALT + $PW))
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(.*\.)?(password|passwd|pwd|pass|passphrase|userPassword|newPassword|plainPassword)$
