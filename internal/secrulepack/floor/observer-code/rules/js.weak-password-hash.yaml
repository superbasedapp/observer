rules:
  - id: js.weak-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: A password is hashed with a fast general-purpose hash (MD5, SHA-1 or a single SHA-2 round); use bcrypt, scrypt or argon2.
    metadata:
      category: code_vuln
      cwe: CWE-916
    patterns:
      - pattern-either:
          - pattern: $C.createHash("$H").update($PW, ...)
          - pattern: crypto.createHash("$H").update($PW, ...)
          - pattern: md5($PW)
          - pattern: sha1($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(.*\.)?(password|passwd|pwd|pass|passphrase|userPassword|newPassword|plainPassword|plaintextPassword)$
