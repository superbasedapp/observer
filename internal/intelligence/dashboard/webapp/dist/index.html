         phones so `env(safe-area-inset-*)` reports real values. Without it
         those insets are always 0 and the full-viewport mobile terminal
         (LaunchDock) would put its status line under the home indicator.

         DO NOT ADD `interactive-widget=resizes-content` HERE. It was added on
         2026-07-28 as a second, native way to solve the keyboard-occlusion
         defect (D7) and was reverted the same day: it broke touch scrolling in
         the mobile terminal on Chrome/Android, INCLUDING with the keyboard
         dismissed (operator-reported). It is also redundant — under the
         default `resizes-visual` Chrome still shrinks the VISUAL viewport and
         fires `visualViewport.resize`, which is what src/lib/
         useVisualViewport.ts consumes, so the keyboard fix works on Android
         and iOS alike without touching the layout viewport at all.

         Note for anyone re-testing this: the Playwright suites run desktop
         Chromium with `hasTouch`, where a virtual keyboard does not exist and
         `interactive-widget` is therefore INERT. Every mobile spec passed with
         it set. This key cannot be validated by that harness — only on a real

    <script>
      // Pre-paint: read theme preference (light / dark / system) and
      // set data-theme on <html> before any CSS evaluates, avoiding
      // a dark-to-light flash on light-mode users. Mirrors lib/theme.tsx.
      (function () {
        try {
          var m = localStorage.getItem("superbased.theme") || "system";
          var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var eff = m === "system" ? (sysDark ? "dark" : "light") : m;
          document.documentElement.setAttribute("data-theme", eff);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
      // Pre-paint: stamp the density preference (comfortable / compact) the
      // same way, so a compact viewer never sees a comfortable first paint.
      // Mirrors shared/lib/density.ts (key superbased.density); anything unknown leaves the
      // attribute off, which is the comfortable default in tokens.css.
      (function () {
        try {
          var d = localStorage.getItem("superbased.density");
          if (d === "comfortable" || d === "compact") {
            document.documentElement.setAttribute("data-density", d);
          }
        } catch (_) {
          /* storage unavailable: keep the default */
        }
      })();
    </script>

    <style>
      #sbo-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #08090d; color: #848ca2; font-family: Inter, system-ui, -apple-system, sans-serif; }
      #sbo-boot .sbo-label { font-size: 12px; letter-spacing: .02em; }
      #sbo-boot .sbo-mark { position: relative; width: 30px; height: 30px; border-radius: 7px; background: #2647e8; box-shadow: 0 8px 28px -10px #2647e8; }
      #sbo-boot .sbo-mark i { position: absolute; width: 28%; height: 28%; border-radius: 1.5px; background: #fff; animation: sbo-a 1.6s cubic-bezier(.65,0,.35,1) infinite; }
      #sbo-boot .sbo-mark i:first-child { left: 50%; top: 22%; }

      @keyframes sbo-a { 0%,20% { transform: none; } 35%,70% { transform: translateX(-100%); } 85%,100% { transform: none; } }
      @keyframes sbo-b { 0%,20% { transform: none; } 35%,70% { transform: translateX(100%); } 85%,100% { transform: none; } }

      :root[data-theme="light"] #sbo-boot { background: #f4f5f9; color: #646d86; }
      :root[data-theme="dark"] #sbo-boot { background: #08090d; color: #848ca2; }
