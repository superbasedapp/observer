# Demo-estate org-server images from an arbitrary pushed commit, WITHOUT a release.
#
# The demo org server (demo.superbased.app) verifies every image with cosign keyless
# signatures from this repository's GitHub Actions (identity regexp
# https://github.com/marmutapp/superbased-observer-private/.* , issuer
# https://token.actions.githubusercontent.com). The release workflows that sign images
# (npm-release.yml docker_image, agent-access-images.yml mcpgw_image) run only on a v* tag,
# and a v* tag also publishes npm / PyPI / VS Code Marketplace / Open VSX and cuts GitHub
# releases. This workflow is the narrow alternative for rolling the DEMO estate to a build
# that is not released yet (operator ruling, decision D-286 option b, 2026-10-05).
#
# What it does, and nothing more:
#   - builds observer-org and observer-mcpgw (the two images the demo .env pins, kept in
#     lockstep, register row DR-38) from the requested commit;
#   - pushes them to the enterprise registry under ONE non-release tag `demo-<sha9>`
#     (never a v* tag, never the stable / edge channel tags, never an existing tag);
#   - keyless-signs each BY DIGEST with the same pinned cosign as the release workflows, and
#     attests the observer-mcpgw SBOMs the way agent-access-images.yml does;
#   - mirrors the STOCK agentgateway sidecar the requested commit pins (AGENTGATEWAY_IMAGE)
#     into the same registry BY DIGEST, the way agent-access-images.yml's agentgateway_mirror
#     does: upstream identity + provenance verified, SBOM'd, CVE-gated (report-only here),
#     copied without ever overwriting an existing mirror, counter-signed and attested (T-752;
#     the rc.3 demo roll had to import v1.6.0 by hand, D-566).
# What it never does: publish to npm, PyPI, the VS Code Marketplace or Open VSX, create a
# GitHub release, or create / push any git tag.
#
# The observer-mcpgw and agentgateway CVE gates (scripts/agent-access-supply-chain-check.sh
# gate) run REPORT-ONLY here: a demo roll is not a release (precedent: the ldemo 03-build-images.sh
# accept-for-demo rule). The release workflow keeps enforcing it.
#
# The orphan tree pushed to the public repo includes .github/workflows/, so every job is
# gated to the private repository (the npm-release.yml / agent-access-images.yml rule).
#
# To use: Actions -> demo-org-images -> Run workflow (from main), with
#   ref      a full 40-hex commit SHA (or a branch) that exists on origin;
#   version  the stamp baked into the binaries, a pre-release with a build suffix,
#            e.g. 1.35.0-rc.13+demo.946c485e0 (it must sort above the last release).
# The run summary prints the digest-pinned ORG_REF / MCPGW_REF / AGENTGATEWAY_IMAGE for the
# on-box roll.

name: demo-org-images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA (full 40 hex) or branch to build; must exist on origin"
        required: true
        type: string
      version:
        description: "Version stamp, pre-release with build suffix (e.g. 1.35.0-rc.13+demo.946c485e0)"
        required: true
        type: string

concurrency:
  group: demo-org-images-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The one spelling of the enterprise registry (= npm-release.yml env.ENTERPRISE_REGISTRY).
  ENTERPRISE_REGISTRY: superbasedenterprise.azurecr.io
  # cosign pinned exactly as npm-release.yml pins it.
  COSIGN_VERSION: v2.6.5
  COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
  # syft / grype pinned exactly as agent-access-images.yml pins them.
  SYFT_VERSION: 1.52.0
  SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
  GRYPE_VERSION: 0.119.0
  GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
  SYFT_CHECK_FOR_APP_UPDATE: 'false'
  GRYPE_CHECK_FOR_APP_UPDATE: 'false'
  CHECK: scripts/agent-access-supply-chain-check.sh
  CVE_EXCEPTIONS: deploy/observer-mcpgw/cve-exceptions.json
  # The identity the demo host's cosign verify pins (deploy cloud-init step 3/8).
  CERT_IDENTITY_REGEXP: https://github.com/marmutapp/superbased-observer-private/.*
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ----------------------------------------------------------------
  # Resolve the commit, the demo tag and the version; refuse anything
  # that could look like a release, and refuse to run without registry
  # credentials (a demo build exists only to be published).
  # ----------------------------------------------------------------
  resolve:
    name: Resolve ref, demo tag and version
    if: github.repository == 'marmutapp/superbased-observer-private'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve
        id: r
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REGISTRY_USERNAME: ${{ secrets.ENTERPRISE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ENTERPRISE_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::error::ENTERPRISE_REGISTRY_* not set; a demo image build has nothing to publish to"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          tag="demo-${sha:0:9}"
          if ! [[ "$tag" =~ ^demo-[0-9a-f]{9}$ ]]; then
            echo "::error::unexpected demo tag '$tag'"
            exit 1
          fi
          # X.Y.Z-<pre-release>+<build>: never v-prefixed, never a bare release version.
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+\+[0-9A-Za-z.-]+$ ]]; then
            echo "::error::version '$INPUT_VERSION' must be a pre-release with a build suffix (X.Y.Z-pre+build)"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$INPUT_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "building $sha as tag $tag, version $INPUT_VERSION"

  # ----------------------------------------------------------------
  # observer-org: build -> push (demo tag only) -> sign by digest.
  # Mirrors npm-release.yml docker_image without the channel tag.
  # ----------------------------------------------------------------
  org_image:
    name: observer-org image (build, push, sign)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Build context from git archive of the commit
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/ctx"
          mkdir -p "$ctx"
          git archive --format=tar "$SHA" | tar -x -C "$ctx"
          test -f "$ctx/Dockerfile.observer-org"
          echo "BUILD_CTX=$ctx" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the enterprise registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ENTERPRISE_REGISTRY }}
          username: ${{ secrets.ENTERPRISE_REGISTRY_USERNAME }}
          password: ${{ secrets.ENTERPRISE_REGISTRY_PASSWORD }}

      - name: Refuse to overwrite an existing tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${ENTERPRISE_REGISTRY}/observer-org:${TAG}" >/dev/null 2>&1; then
            echo "::error::${ENTERPRISE_REGISTRY}/observer-org:${TAG} already exists; never overwrite"
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ env.BUILD_CTX }}
          file: ${{ env.BUILD_CTX }}/Dockerfile.observer-org
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.ENTERPRISE_REGISTRY }}/observer-org:${{ env.TAG }}

      - name: Install cosign (pinned, retried)
        # Byte-identical to npm-release.yml's install script.
        run: |
          set -euo pipefail
          base="${COSIGN_DOWNLOAD_BASE:-https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}}"
          mkdir -p "${HOME}/.cosign"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            -o "${HOME}/.cosign/cosign" "${base}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${HOME}/.cosign/cosign" | sha256sum -c -
          chmod +x "${HOME}/.cosign/cosign"
          echo "${HOME}/.cosign" >> "${GITHUB_PATH}"
          "${HOME}/.cosign/cosign" version

      - name: Sign image by digest (keyless) and self-verify
        env:
          REF: ${{ env.ENTERPRISE_REGISTRY }}/observer-org@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign verify "$REF" --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
          echo "signed $REF"

  # ----------------------------------------------------------------
  # observer-mcpgw: build -> SBOM -> CVE gate (report-only) -> push the
  # scanned image -> sign + attest. Mirrors agent-access-images.yml
  # mcpgw_image (no SLSA provenance job: that generator is tag-bound).
  # ----------------------------------------------------------------
  mcpgw_image:
    name: observer-mcpgw image (build, SBOM, CVE report, push, sign, attest)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Build context from git archive of the commit
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/ctx"
          mkdir -p "$ctx"
          git archive --format=tar "$SHA" | tar -x -C "$ctx"
          test -f "$ctx/Dockerfile.observer-mcpgw"
          echo "BUILD_CTX=$ctx" >> "$GITHUB_ENV"

      - name: Install syft + grype (pinned, retried)
        run: |
          set -euo pipefail
          dir="${HOME}/.sbom-tools"
          mkdir -p "$dir"
          fetch() {
            local name="$1" ver="$2" sha="$3" tgz="${RUNNER_TEMP}/$1.tar.gz"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
              -o "$tgz" "https://github.com/anchore/${name}/releases/download/v${ver}/${name}_${ver}_linux_amd64.tar.gz"
            echo "${sha}  ${tgz}" | sha256sum -c -
            tar -xzf "$tgz" -C "$dir" "$name"
          }
          fetch syft "$SYFT_VERSION" "$SYFT_SHA256"
          fetch grype "$GRYPE_VERSION" "$GRYPE_SHA256"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/syft" version
          "$dir/grype" version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ env.BUILD_CTX }}
          file: ${{ env.BUILD_CTX }}/Dockerfile.observer-mcpgw
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: observer-mcpgw:demo-scan

      - name: SBOM (SPDX + CycloneDX) and CVE gate (report-only for a demo build)
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft scan docker:observer-mcpgw:demo-scan -q \
            -o spdx-json=sbom/observer-mcpgw.spdx.json \
            -o cyclonedx-json=sbom/observer-mcpgw.cdx.json
          grype sbom:sbom/observer-mcpgw.cdx.json -o table -o json=sbom/observer-mcpgw.grype.json
          if ! "$CHECK" gate --grype-json sbom/observer-mcpgw.grype.json --image observer-mcpgw --exceptions "$CVE_EXCEPTIONS"; then
            echo "::warning::observer-mcpgw CVE gate FAILED (report-only for a demo build; a v* release enforces it)"
          fi

      - name: Upload SBOMs + scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-sbom-observer-mcpgw
          path: sbom/
          retention-days: 30
          if-no-files-found: warn

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ENTERPRISE_REGISTRY }}
          username: ${{ secrets.ENTERPRISE_REGISTRY_USERNAME }}
          password: ${{ secrets.ENTERPRISE_REGISTRY_PASSWORD }}

      - name: Push the scanned image (refuses an existing tag)
        id: push
        run: |
          set -euo pipefail
          image="${ENTERPRISE_REGISTRY}/observer-mcpgw"
          if docker buildx imagetools inspect "${image}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${image}:${TAG} already exists; never overwrite"
            exit 1
          fi
          docker tag observer-mcpgw:demo-scan "${image}:${TAG}"
          docker push "${image}:${TAG}"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${image}:${TAG}" | sed -n "s|^${image}@||p" | head -n1)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve the pushed digest of ${image}:${TAG}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign (pinned, retried)
        # Byte-identical to npm-release.yml's install script.
        run: |
          set -euo pipefail
          base="${COSIGN_DOWNLOAD_BASE:-https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}}"
          mkdir -p "${HOME}/.cosign"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            -o "${HOME}/.cosign/cosign" "${base}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${HOME}/.cosign/cosign" | sha256sum -c -
          chmod +x "${HOME}/.cosign/cosign"
          echo "${HOME}/.cosign" >> "${GITHUB_PATH}"
          "${HOME}/.cosign/cosign" version

      - name: Sign by digest (keyless), attest the SBOMs and self-verify
        env:
          REF: ${{ env.ENTERPRISE_REGISTRY }}/observer-mcpgw@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom/observer-mcpgw.spdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom/observer-mcpgw.cdx.json "$REF"
          cosign verify "$REF" --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
          echo "signed + attested $REF"

  # ----------------------------------------------------------------
  # agentgateway: the STOCK sidecar the demo .env pins (AGENTGATEWAY_IMAGE),
  # mirrored the way agent-access-images.yml's agentgateway_mirror does it
  # (T-752), so a demo re-pin needs no manual `az acr import`: verify the
  # digest the REQUESTED commit pins against the exact upstream release
  # identity + its provenance, SBOM it (image + Cargo.lock at the pinned
  # revision), run the CVE gate (REPORT-ONLY here, like mcpgw_image above),
  # copy it BY DIGEST into the enterprise registry (never over an existing
  # mirror: that would drop earlier counter-signatures), re-verify the copy,
  # then counter-sign it by digest and attest the SBOMs with this workflow's
  # keyless identity (it matches the demo host's identity regexp).
  # ----------------------------------------------------------------
  agentgateway_mirror:
    name: agentgateway mirror (verify upstream, SBOM, CVE report, copy, counter-sign, attest)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      repository: ${{ steps.copy.outputs.repository }}
      version: ${{ steps.copy.outputs.version }}
      digest: ${{ steps.copy.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install cosign (pinned, retried)
        # Byte-identical to npm-release.yml's install script.
        run: |
          set -euo pipefail
          base="${COSIGN_DOWNLOAD_BASE:-https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}}"
          mkdir -p "${HOME}/.cosign"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            -o "${HOME}/.cosign/cosign" "${base}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${HOME}/.cosign/cosign" | sha256sum -c -
          chmod +x "${HOME}/.cosign/cosign"
          echo "${HOME}/.cosign" >> "${GITHUB_PATH}"
          "${HOME}/.cosign/cosign" version

      - name: Install syft + grype (pinned, retried)
        run: |
          set -euo pipefail
          dir="${HOME}/.sbom-tools"
          mkdir -p "$dir"
          fetch() {
            local name="$1" ver="$2" sha="$3" tgz="${RUNNER_TEMP}/$1.tar.gz"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
              -o "$tgz" "https://github.com/anchore/${name}/releases/download/v${ver}/${name}_${ver}_linux_amd64.tar.gz"
            echo "${sha}  ${tgz}" | sha256sum -c -
            tar -xzf "$tgz" -C "$dir" "$name"
          }
          fetch syft "$SYFT_VERSION" "$SYFT_SHA256"
          fetch grype "$GRYPE_VERSION" "$GRYPE_SHA256"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/syft" version
          "$dir/grype" version

      - name: Read the pin of the requested commit (compose + agwpin, drift refused)
        run: |
          set -euo pipefail
          "$CHECK" pins | tee -a "$GITHUB_ENV"

      - name: Verify the upstream signature (exact release identity) and provenance
        run: |
          set -euo pipefail
          "$CHECK" upstream

      - name: SBOMs (image + Cargo.lock at the pinned revision) and CVE gate (report-only for a demo build)
        run: |
          set -euo pipefail
          mkdir -p sbom "${RUNNER_TEMP}/agw-src"
          syft scan "registry:${AGW_REPOSITORY}@${AGW_DIGEST}" --platform linux/amd64 -q \
            -o spdx-json=sbom/agentgateway.spdx.json \
            -o cyclonedx-json=sbom/agentgateway.cdx.json
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            -o "${RUNNER_TEMP}/agw-src/Cargo.lock" \
            "https://raw.githubusercontent.com/agentgateway/agentgateway/${AGW_SOURCE_REVISION}/Cargo.lock"
          syft scan "dir:${RUNNER_TEMP}/agw-src" -q -o cyclonedx-json=sbom/agentgateway-cargo-lock.cdx.json
          for s in agentgateway agentgateway-cargo-lock; do
            grype "sbom:sbom/${s}.cdx.json" -o table -o "json=sbom/${s}.grype.json"
            if ! "$CHECK" gate --grype-json "sbom/${s}.grype.json" --image agentgateway --exceptions "$CVE_EXCEPTIONS"; then
              echo "::warning::agentgateway CVE gate FAILED on ${s} (report-only for a demo build; a v* release enforces it)"
            fi
          done

      - name: Upload SBOMs + scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-sbom-agentgateway
          path: sbom/
          retention-days: 30
          if-no-files-found: warn

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ENTERPRISE_REGISTRY }}
          username: ${{ secrets.ENTERPRISE_REGISTRY_USERNAME }}
          password: ${{ secrets.ENTERPRISE_REGISTRY_PASSWORD }}

      - name: Copy by digest (upstream signatures + attestations travel)
        id: copy
        run: |
          set -euo pipefail
          dst="${ENTERPRISE_REGISTRY}/agentgateway"
          # Never `cosign copy -f` over an existing mirror: that would replace the
          # .sig tag and drop earlier counter-signatures (the release mirror's too).
          if docker buildx imagetools inspect "${dst}@${AGW_DIGEST}" >/dev/null 2>&1; then
            echo "${dst}@${AGW_DIGEST} already mirrored; keeping its signatures"
          else
            cosign copy "${AGW_REPOSITORY}@${AGW_DIGEST}" "${dst}:${AGW_VERSION}"
          fi
          # The copy must carry the upstream signature and provenance unchanged.
          "$CHECK" upstream --ref "${dst}@${AGW_DIGEST}"
          {
            echo "repository=${dst}"
            echo "version=${AGW_VERSION}"
            echo "digest=${AGW_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Counter-sign by digest (keyless), attest our SBOMs and self-verify
        env:
          REF: ${{ steps.copy.outputs.repository }}@${{ steps.copy.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom/agentgateway.spdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom/agentgateway.cdx.json "$REF"
          cosign attest --yes --type "$AGW_SOURCE_SBOM_TYPE" --predicate sbom/agentgateway-cargo-lock.cdx.json "$REF"
          cosign verify "$REF" --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
          echo "counter-signed + attested $REF"

  # ----------------------------------------------------------------
  # The digest-pinned refs the on-box roll consumes.
  # ----------------------------------------------------------------
  summary:
    name: Digest-pinned refs for the demo roll
    needs: [resolve, org_image, mcpgw_image, agentgateway_mirror]
    runs-on: ubuntu-latest
    steps:
      - name: Print the refs
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ORG_DIGEST: ${{ needs.org_image.outputs.digest }}
          MCPGW_DIGEST: ${{ needs.mcpgw_image.outputs.digest }}
          AGW_REPOSITORY: ${{ needs.agentgateway_mirror.outputs.repository }}
          AGW_VERSION: ${{ needs.agentgateway_mirror.outputs.version }}
          AGW_DIGEST: ${{ needs.agentgateway_mirror.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Demo org-server images"
            echo ""
            echo "- source commit: \`${SHA}\`"
            echo "- version: \`${VERSION}\`"
            echo "- \`ORG_REF=${ENTERPRISE_REGISTRY}/observer-org:${TAG}@${ORG_DIGEST}\`"
            echo "- \`MCPGW_REF=${ENTERPRISE_REGISTRY}/observer-mcpgw:${TAG}@${MCPGW_DIGEST}\`"
            echo "- \`AGENTGATEWAY_IMAGE=${AGW_REPOSITORY}:${AGW_VERSION}@${AGW_DIGEST}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
