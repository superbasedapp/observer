# Staged distro artifacts (modular packaging plan 5.2 / 5.4 / 5.5, phase
# P3, lane MP-REL). DRY RUN ONLY: this workflow builds the four prebuilt
# node distros for the five release platforms with their evidence set and
# keeps them as short-lived workflow artifacts for inspection, and builds
# the two observer-org image flavours (full, core) locally on the runner
# (binary proof, SBOM, a `docker build` that is never pushed). It never
# creates a release, never attaches an asset, never publishes to npm, PyPI,
# the VS Code Marketplace or Open VSX, never signs and never pushes a tag.
# It runs only when started by hand (Actions -> distro-staging -> Run
# workflow); a v* tag push does not trigger it. Since v1.36.0 (T-729) the
# release pipeline (npm-release.yml, jobs edition_web / edition_build /
# public_release) builds and publishes the minimal, developer and managed
# editions itself, with the real vendor key; npm, PyPI and the VS Code
# extension still ship the unstamped full build. This workflow stays the
# dry-run shape check.
#
# Per distro the frontend is built once with the distro's page registry
# (`go run ./web/compgen -distro <name>`, which drops the pages, and so the
# lazy chunks, of components the distro excludes; plan 5.1 rev N5), then
# each platform binary embeds that bundle, exactly the build-once,
# ship-everywhere shape of npm-release.yml's frontend job. `full` keeps the
# committed registry (every page).
#
# Evidence per artifact (scripts/build-distro.sh):
#   observer-<distro>-<os>-<arch>[.exe]   the binary
#   .buildinfo.txt                        go version -m
#   .cdx.json                             CycloneDX SBOM (sbo-components sbom)
#   .proof.json                           proof record (sbo-components proof;
#                                         --run on linux/amd64 only)
#   .vex.json                             govulncheck -mode binary, OpenVEX
#   reproducible double build             a second build of the same cell
#                                         must be byte-identical (cmp)
# Per distro web bundle:
#   web-proof.json / .modules.json        the forbidden-module list and the
#                                         emitted chunk module graph; the
#                                         build FAILS if a chunk carries a
#                                         module of an excluded component
#                                         (vite.config.ts sboDistroProof)
# Release shape (job `release-shape`, lane MP-REL2, plan 5.6): the binaries
# are packed under their distro archive names (full keeps the unsuffixed
# name, every other distro inserts its name after the version), with
# SHA256SUMS, a raw Ed25519 .sig per archive and the vendor-signed
# release-index.json, ALL signed with an EPHEMERAL key generated on the
# runner and deleted with it (vendorsign keygen + -allow-unpinned-key): no
# agent trusts it, no real key reaches this workflow, and the result is a
# shape check, not a release. cosign sign-blob and SLSA provenance are
# printed as the commands the release job would run, never executed.

name: distro-staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string stamped into main.version (label only; nothing is tagged)'
        required: false
        default: 'staged'

permissions:
  contents: read

# The dispatch input reaches shell ONLY through this variable, and every job
# that uses it validates it first (REVIEW-4 P4-21: `${{ inputs.version }}`
# was expanded into run: scripts before bash parsed them, so a crafted
# version string ran as shell on the runner). custom-build.yml does the same.
env:
  STAGE_VERSION: ${{ inputs.version }}

concurrency:
  group: distro-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web ${{ matrix.distro }}
    if: github.repository == 'marmutapp/superbased-observer-private'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        distro: [minimal, developer, managed, full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: page registry and proof list for the distro
        run: |
          mkdir -p web-proof
          if [ "${{ matrix.distro }}" = full ]; then
            go run ./web/compgen -o /dev/null -proof web-proof/web-proof.json
          else
            go run ./web/compgen -distro ${{ matrix.distro }} -proof web-proof/web-proof.json
          fi
      - name: build (fails on a forbidden module in any chunk)
        run: |
          cd web
          npm ci
          SBO_DISTRO_PROOF="$GITHUB_WORKSPACE/web-proof/web-proof.json" npm run build
          test -f dist/index.html
          test -f "$GITHUB_WORKSPACE/web-proof/web-proof.modules.json"
      - uses: actions/upload-artifact@v7
        with:
          name: web-proof-${{ matrix.distro }}
          path: web-proof/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ matrix.distro }}
          path: web/dist/
          retention-days: 3
          if-no-files-found: error

  build:
    name: ${{ matrix.distro }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [minimal, developer, managed, full]
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ matrix.distro }}
          path: web/dist/
      - name: embed the distro's bundle
        run: scripts/sync-web-embed.sh web/dist internal/intelligence/dashboard/webapp/dist
      - name: build + proof + SBOM
        run: |
          set -euo pipefail
          [[ "$STAGE_VERSION" =~ ^(staged|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "version must be staged or vX.Y.Z[-pre]" >&2; exit 2; }
          scripts/build-distro.sh ${{ matrix.distro }} \
            --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} \
            --version "$STAGE_VERSION" --out staged --proof
      - name: reproducible double build
        run: |
          set -euo pipefail
          scripts/build-distro.sh ${{ matrix.distro }} --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} \
            --version "$STAGE_VERSION" --out rebuild --no-sbom
          for f in rebuild/observer-${{ matrix.distro }}-*; do
            case "$f" in *.txt|*.json) continue ;; esac
            cmp "$f" "staged/$(basename "$f")"
            echo "reproducible: $(basename "$f")"
          done
          rm -rf rebuild
      - name: govulncheck (binary mode, OpenVEX)
        run: |
          set -euo pipefail
          for f in staged/observer-${{ matrix.distro }}-*; do
            case "$f" in *.txt|*.json) continue ;; esac
            go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -mode binary -format openvex "$f" > "$f.vex.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: staged-${{ matrix.distro }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: staged/
          retention-days: 3
          if-no-files-found: error

  # observer-org image flavours (plan 3.4; the P6b core-image proof run).
  # The binary is built and proved like a distro (scripts/build-distro.sh
  # --image), then the container image is built from Dockerfile.observer-org
  # with --build-arg IMAGE=<flavour> and only loaded into the runner's
  # local Docker: no registry login, no push, no signature. The binary
  # inside the image is copied out and its tags are compared with the
  # catalog's, so the Dockerfile's own tag computation is proved too.
  org-image:
    name: observer-org ${{ matrix.image }} (dry run)
    if: github.repository == 'marmutapp/superbased-observer-private'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [full, core]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: binary + proof + SBOM
        run: |
          set -euo pipefail
          [[ "$STAGE_VERSION" =~ ^(staged|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "version must be staged or vX.Y.Z[-pre]" >&2; exit 2; }
          scripts/build-distro.sh --image ${{ matrix.image }} --version "$STAGE_VERSION" --out staged --proof
      - name: container image (local only, never pushed)
        run: |
          set -euo pipefail
          docker build --build-arg IMAGE=${{ matrix.image }} --build-arg VERSION="$STAGE_VERSION" \
            -f Dockerfile.observer-org -t observer-org-staged:${{ matrix.image }} .
          cid=$(docker create observer-org-staged:${{ matrix.image }})
          docker cp "$cid":/usr/local/bin/observer-org staged/observer-org-in-image-${{ matrix.image }} \
            || docker cp "$cid":/observer-org staged/observer-org-in-image-${{ matrix.image }}
          docker rm "$cid" >/dev/null
          want="$(go run ./cmd/sbo-components tags --image ${{ matrix.image }})"
          got="$(go version -m staged/observer-org-in-image-${{ matrix.image }} | awk '$1=="build" && $2 ~ /^-tags=/ {sub(/^-tags=/,"",$2); print $2}')"
          echo "image tags: ${got:-none}; catalog: ${want:-none}"
          [ "$got" = "$want" ]
      - uses: actions/upload-artifact@v7
        with:
          name: staged-observer-org-${{ matrix.image }}
          path: staged/
          retention-days: 3
          if-no-files-found: error

  # The release shape of plan 5.6 (lane MP-REL2): distro archive names,
  # SHA256SUMS, per-archive .sig and the vendor-signed release index, all
  # under an EPHEMERAL key (see the header). The org server's importer and
  # a node verify exactly these files; with a throwaway key the run proves
  # the shape and the tooling, and nothing it produces is trusted anywhere.
  release-shape:
    name: release shape (ephemeral key, never published)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: staged-*
          path: in/
          merge-multiple: true
      - name: pack distro archives
        env:
          ARCHIVE_VERSION: v0.0.0
        run: |
          set -euo pipefail
          mkdir -p shape
          for bin in in/observer-*; do
            base="$(basename "$bin")"
            case "$base" in *.txt|*.json|observer-org-*) continue ;; esac
            stem="${base%.exe}"
            IFS=- read -r _ distro goos goarch <<<"$stem"
            case "$goos" in windows) os=win32 ;; *) os="$goos" ;; esac
            case "$goarch" in amd64) arch=x64 ;; *) arch="$goarch" ;; esac
            if [ "$distro" = full ]; then name="observer-${ARCHIVE_VERSION}-${os}-${arch}"; else name="observer-${ARCHIVE_VERSION}-${distro}-${os}-${arch}"; fi
            work="$(mktemp -d)"
            if [ "$goos" = windows ]; then
              cp "$bin" "$work/observer.exe"; cp "$bin" "$work/superbased.exe"
              (cd "$work" && zip -q -X "$GITHUB_WORKSPACE/shape/$name.zip" observer.exe superbased.exe)
            else
              cp "$bin" "$work/observer"; chmod 0755 "$work/observer"; ln -s observer "$work/superbased"
              tar -C "$work" --owner=0 --group=0 --numeric-owner -czf "shape/$name.tar.gz" observer superbased
            fi
            rm -rf "$work"
          done
          (cd shape && sha256sum observer-* > SHA256SUMS)
          ls -l shape
      - name: sign with an ephemeral key and build the release index
        env:
          ARCHIVE_VERSION: v0.0.0
        run: |
          set -euo pipefail
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          go run ./scripts/vendorsign keygen -out "$keydir"
          key="$(ls "$keydir"/*.key 2>/dev/null | head -1)"
          go run ./scripts/vendorsign sign -key "$key" -allow-unpinned-key shape/observer-*
          go run ./scripts/vendorsign index -key "$key" -allow-unpinned-key -dir shape -version "$ARCHIVE_VERSION"
          test -s shape/release-index.json && test -s shape/release-index.json.sig
      - name: cosign and SLSA (printed, never run)
        run: |
          echo "The release job would run, per archive and for release-index.json:"
          echo "  cosign sign-blob --yes --bundle <file>.cosign.bundle <file>"
          echo "  slsa-github-generator generic provenance over SHA256SUMS"
          echo "This workflow has no id-token permission and runs neither."
      - uses: actions/upload-artifact@v7
        with:
          name: release-shape
          path: shape/
          retention-days: 3
          if-no-files-found: error
